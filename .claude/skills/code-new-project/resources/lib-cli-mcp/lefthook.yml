# Run `lefthook install` once after cloning to activate.
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    rust-fmt:
      glob: "*.rs"
      run: cargo fmt --check
    rust-clippy:
      glob: "*.rs"
      run: cargo clippy --workspace --all-targets -- -D warnings

pre-push:
  commands:
    rust-test:
      run: cargo test --workspace
