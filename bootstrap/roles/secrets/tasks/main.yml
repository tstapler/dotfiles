---
- name: Check if 1Password desktop app is already installed (Linux)
  stat:
    path: /opt/1Password/1password
  register: secrets_1password_installed
  when: ansible_facts['os_family'] != "Darwin"
  tags: [secrets]

# The Flatpak/Snap builds are sandboxed and can't do CLI/SSH-agent integration
# at all (confirmed: no `op`/`1password-mcp` binary ships inside the sandbox,
# and no flatpak permission override can add a binary that isn't in the
# bundle). Install the official .tar.gz instead — same steps 1Password's own
# install docs give for "ARM or other distributions".
- name: Set 1Password download architecture (Linux)
  set_fact:
    secrets_1password_arch: "{{ 'aarch64' if ansible_facts['architecture'] == 'aarch64' else 'x86_64' }}"
  when: ansible_facts['os_family'] != "Darwin" and not secrets_1password_installed.stat.exists
  tags: [secrets]

- name: Download 1Password signing key (Linux)
  get_url:
    url: https://downloads.1password.com/linux/keys/1password.asc
    dest: /tmp/1password.asc
    mode: "0644"
  when: ansible_facts['os_family'] != "Darwin" and not secrets_1password_installed.stat.exists
  tags: [secrets]

- name: Import 1Password signing key into a scratch keyring (Linux)
  command: gpg --no-default-keyring --keyring /tmp/1password-keyring.gpg --import /tmp/1password.asc
  changed_when: false
  when: ansible_facts['os_family'] != "Darwin" and not secrets_1password_installed.stat.exists
  tags: [secrets]

- name: Download 1Password tarball and detached signature (Linux)
  get_url:
    url: "https://downloads.1password.com/linux/tar/stable/{{ secrets_1password_arch }}/1password-latest.tar.gz{{ item }}"
    dest: "/tmp/1password-latest.tar.gz{{ item }}"
    mode: "0644"
  loop: ["", ".sig"]
  when: ansible_facts['os_family'] != "Darwin" and not secrets_1password_installed.stat.exists
  tags: [secrets]

- name: Verify 1Password tarball signature (Linux)
  command: gpg --no-default-keyring --keyring /tmp/1password-keyring.gpg --verify /tmp/1password-latest.tar.gz.sig /tmp/1password-latest.tar.gz
  changed_when: false
  when: ansible_facts['os_family'] != "Darwin" and not secrets_1password_installed.stat.exists
  tags: [secrets]

- name: Extract 1Password into /opt/1Password (Linux)
  unarchive:
    src: /tmp/1password-latest.tar.gz
    dest: /opt/1Password
    remote_src: true
    extra_opts: ["--strip-components=1"]
  become: true
  when: ansible_facts['os_family'] != "Darwin" and not secrets_1password_installed.stat.exists
  tags: [secrets]

# ponytail: installs once, doesn't auto-update — delete /opt/1Password and
# re-run `--tags secrets` to pick up a newer release.
- name: Run 1Password after-install script (Linux)
  command: /opt/1Password/after-install.sh
  become: true
  when: ansible_facts['os_family'] != "Darwin" and not secrets_1password_installed.stat.exists
  tags: [secrets]

- name: Clean up 1Password install artifacts (Linux)
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/1password.asc
    - /tmp/1password-keyring.gpg
    - /tmp/1password-latest.tar.gz
    - /tmp/1password-latest.tar.gz.sig
  when: ansible_facts['os_family'] != "Darwin" and not secrets_1password_installed.stat.exists
  tags: [secrets]

- name: Install PolKit authentication agent for CLI biometric unlock (Arch, Linux)
  pacman:
    name: lxqt-policykit
    state: present
  become: true
  when: ansible_facts['os_family'] == "Archlinux"
  tags: [secrets]

- name: Print CLI biometric unlock setup instructions (Linux)
  debug:
    msg: |
      Skip `op signin`/session-token juggling entirely by turning on 1Password's
      CLI biometric unlock (one-time, in the desktop app GUI — can't be scripted):
        1. Open and unlock the 1Password desktop app.
        2. Settings > Developer > "Integrate with 1Password CLI".
        3. Set your Linux user's system authentication method to fingerprint or
           password under your system settings.
      Once enabled, any `op` command (e.g. `op inject`, `op whoami`) prompts via
      the PolKit agent instead of requiring `eval $(op signin)` or an OP_SESSION
      env var. i3 doesn't ship a PolKit agent — lxqt-policykit was installed
      above and is autostarted from .i3/config. KDE and GNOME already ship
      their own agent, so this only matters for minimal WMs like i3.
  when: ansible_facts['os_family'] != "Darwin"
  tags: [secrets]

- name: Check 1Password CLI is installed
  command: which op
  register: secrets_op_check
  failed_when: false
  changed_when: false
  environment:
    PATH: "{{ brew_prefix }}/bin:{{ ansible_facts['env']['PATH'] }}"
  tags: [secrets]

- name: Fail with instructions if op CLI is not installed
  fail:
    msg: |
      1Password CLI (op) is required for secrets management but was not found on PATH.
      Install it: brew install --cask 1password-cli
      Then re-run: ansible-playbook bootstrap/playbook.yml --tags secrets
  when: secrets_op_check.rc != 0
  tags: [secrets]

- name: Check for active 1Password session
  command: op account list
  register: secrets_op_accounts
  failed_when: false
  changed_when: false
  environment:
    PATH: "{{ brew_prefix }}/bin:{{ ansible_facts['env']['PATH'] }}"
  tags: [secrets]

- name: Print sign-in instructions if no active session
  debug:
    msg: |
      No active 1Password session found. Sign in with:
        eval $(op signin)
      Then re-run: ansible-playbook bootstrap/playbook.yml --tags secrets
      Skipping dry-run secret injection test.
  when: secrets_op_accounts.rc != 0 or secrets_op_accounts.stdout | length == 0
  tags: [secrets]

- name: Test secret injection via op inject dry-run
  shell: |
    echo "{{ '{{' }} op://Personal/test-placeholder/password {{ '}}' }}" | op inject --dry-run
  register: secrets_op_inject_test
  failed_when: false
  changed_when: false
  when: secrets_op_accounts.rc == 0 and secrets_op_accounts.stdout | length > 0
  environment:
    PATH: "{{ brew_prefix }}/bin:{{ ansible_facts['env']['PATH'] }}"
  tags: [secrets]

- name: Report secret injection test result
  debug:
    msg: "op inject dry-run: {{ 'PASS' if secrets_op_inject_test.rc == 0 else 'FAIL — check op session' }}"
  when: secrets_op_accounts.rc == 0 and secrets_op_accounts.stdout | length > 0
  tags: [secrets]
