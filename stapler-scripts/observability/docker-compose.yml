x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    restart: unless-stopped
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    depends_on:
      - victoriametrics
      - tempo
    logging: *default-logging

  tempo:
    image: grafana/tempo:2.10.8
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"  # query API — Grafana reaches it via the tempo: hostname regardless

    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    logging: *default-logging

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.150.0
    restart: unless-stopped
    ports:
      - "8428:8428"
    volumes:
      - victoriametrics_data:/victoria-metrics-data
    logging: *default-logging

  pyroscope:
    image: grafana/pyroscope:1.14.0
    restart: unless-stopped
    ports:
      - "4040:4040"  # query API + own UI — Grafana reaches it via the pyroscope: hostname regardless
    volumes:
      - pyroscope_data:/data
    logging: *default-logging

  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0
    restart: unless-stopped
    command: ["--storageDataPath=/victoria-logs-data"]
    ports:
      - "9428:9428"  # query API + OTLP log ingestion — Grafana/otel-collector reach it via the victorialogs: hostname regardless
    volumes:
      - victorialogs_data:/victoria-logs-data
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.11.1
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    ports:
      - "12345:12345"  # Alloy's own debug UI (component graph, scrape status)
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy
    extra_hosts:
      - "host.docker.internal:host-gateway"  # no-op on Docker Desktop (already resolves); required on native Linux Docker
    depends_on:
      - pyroscope
    logging: *default-logging

  grafana:
    image: mirror.gcr.io/grafana/grafana:11.5.2
    restart: unless-stopped
    ports:
      - "48300:3000"  # non-standard host port — :3000 is one of the most commonly
                       # already-bound dev ports (Next.js, CRA, etc.); see README
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource
    depends_on:
      - victoriametrics
      - pyroscope
      - victorialogs
    logging: *default-logging

volumes:
  victoriametrics_data:
  grafana_data:
  tempo_data:
  pyroscope_data:
  victorialogs_data:
