x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    restart: unless-stopped
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    depends_on:
      - victoriametrics
      - tempo
    logging: *default-logging

  tempo:
    image: grafana/tempo:2.10.8
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "3200:3200"  # query API — Grafana reaches it via the tempo: hostname regardless

    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    logging: *default-logging

  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.150.0
    restart: unless-stopped
    ports:
      - "8428:8428"
    volumes:
      - victoriametrics_data:/victoria-metrics-data
    logging: *default-logging

  pyroscope:
    image: grafana/pyroscope:1.14.0
    restart: unless-stopped
    ports:
      - "4040:4040"  # query API + own UI — Grafana reaches it via the pyroscope: hostname regardless
    volumes:
      - pyroscope_data:/data
    logging: *default-logging

  victorialogs:
    image: victoriametrics/victoria-logs:v1.52.0
    restart: unless-stopped
    command: ["--storageDataPath=/victoria-logs-data"]
    ports:
      - "9428:9428"  # query API + OTLP log ingestion — Grafana/otel-collector reach it via the victorialogs: hostname regardless
    volumes:
      - victorialogs_data:/victoria-logs-data
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.11.1
    restart: unless-stopped
    # Compose bridge + host.docker.internal. On Docker Desktop for Mac this
    # reaches stapler-squad's loopback-only pprof listener (verified), while
    # `network_mode: host` does NOT — it targets the Docker VM, so `localhost`
    # was refused and no profiles landed. On Linux, loopback-only pprof is
    # unreachable from the bridge; run pprof on the bridge IP or use host mode.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy
    depends_on:
      - pyroscope
    logging: *default-logging

  grafana:
    image: mirror.gcr.io/grafana/grafana:11.5.2
    restart: unless-stopped
    ports:
      - "48300:3000"  # non-standard host port — :3000 is one of the most commonly
                       # already-bound dev ports (Next.js, CRA, etc.); see README
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards/general:/var/lib/grafana/dashboards/general
      # stapler-squad's dashboards now live in that repo (docs/observability/),
      # not here — bind-mounted directly so there's one copy, not two kept in
      # sync by hand. allowUiUpdates writes straight into that repo's working
      # tree; `git diff` there after a UI edit. See stapler-squad's
      # docs/observability/README.md. Override the checkout location with
      # STAPLER_SQUAD_DASHBOARDS_DIR (e.g. a worktree or a non-default clone).
      - ${STAPLER_SQUAD_DASHBOARDS_DIR:-${HOME}/code/github.com/tstapler/stapler-squad/docs/observability/grafana/dashboards}:/var/lib/grafana/dashboards/stapler-squad
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=victoriametrics-logs-datasource
    depends_on:
      - victoriametrics
      - pyroscope
      - victorialogs
    logging: *default-logging

volumes:
  victoriametrics_data:
  grafana_data:
  tempo_data:
  pyroscope_data:
  victorialogs_data:
