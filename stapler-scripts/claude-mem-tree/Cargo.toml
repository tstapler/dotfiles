[package]
name = "claude-mem-tree"
version = "0.1.0"
edition = "2021"
description = "Live memory tree (RSS/PSS) for a Claude Code process and its descendants — MCP servers, spawned test runners, subshells"

[[bin]]
name = "claude-mem-tree"
path = "src/main.rs"

[dependencies]
anyhow    = "1"
clap      = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui   = "0.30"
