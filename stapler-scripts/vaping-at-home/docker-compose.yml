x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  vaping:
    build: .
    image: vaping:local
    restart: unless-stopped
    ports:
      - "9790:9099"  # Prometheus metrics endpoint
    volumes:
      - ./config.yaml:/etc/vaping/config.yaml
    environment:
      - VAPING_HOME=/etc/vaping
      - VAPING_CONFIG=/etc/vaping/config.yaml
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  prometheus:
    image: mirror.gcr.io/prom/prometheus:v3.2.1
    ports:
      - "9791:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: mirror.gcr.io/grafana/grafana:11.5.2
    ports:
      - "3719:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/network-monitoring/network_latency.json
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    logging: *default-logging

  loki:
    image: mirror.gcr.io/grafana/loki:3.3.2
    ports:
      - "3792:3100"  # Non-standard port in 3700 range
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    logging: *default-logging

  promtail:
    image: mirror.gcr.io/grafana/promtail:3.3.2
    ports:
      - "9793:9080"  # Non-standard port in 9700 range
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yml
      - /private/var/log:/private/var/log:ro
      - ${HOME}/Library/Logs/vaping-unified-logs:/Users/tstapler/Library/Logs/vaping-unified-logs:ro
      - promtail_positions:/tmp
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki
    logging: *default-logging

  # Real host network/CPU/memory metrics come from a native node_exporter
  # running on the Mac via `brew services` (see README) - a containerized
  # node-exporter can only ever see Docker Desktop's LinuxKit VM, not the
  # Mac's actual interfaces, so it was replaced with the native binary
  # scraped at host.docker.internal:9100 (see prometheus.yml).

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
