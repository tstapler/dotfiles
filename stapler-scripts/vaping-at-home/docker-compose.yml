x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Probe only. Storage, dashboards and alerts live in ../observability, whose
# Alloy scrapes this container at host.docker.internal:9790.
services:
  vaping:
    build: .
    image: vaping:local
    restart: unless-stopped
    ports:
      - "9790:9099"  # Prometheus metrics endpoint; scraped by observability's Alloy
    volumes:
      - ./config.yaml:/etc/vaping/config.yaml
    environment:
      - VAPING_HOME=/etc/vaping
      - VAPING_CONFIG=/etc/vaping/config.yaml
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
