global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'vaping'
    static_configs:
      - targets: ['vaping:9099']

  - job_name: 'node-exporter'
    static_configs:
      # Native node_exporter running on the Mac host (brew services), not in
      # Docker - Docker Desktop's LinuxKit VM has no visibility into the
      # host's real network interfaces, only its own virtual ones.
      - targets: ['host.docker.internal:9100']
        labels:
          instance: 'macos-host'
