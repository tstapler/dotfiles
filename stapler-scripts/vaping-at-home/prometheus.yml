global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'vaping'
    static_configs:
      - targets: ['vaping:9099']

  - job_name: 'node-exporter'
    # Native node_exporter on the host (not in Docker: Docker Desktop's LinuxKit
    # VM can't see the Mac's real interfaces). The target file is copied per OS
    # by `make prometheus_targets.d/node-exporter.yml` from the *.dist files.
    file_sd_configs:
      - files: ['/etc/prometheus/targets.d/node-exporter.yml']
