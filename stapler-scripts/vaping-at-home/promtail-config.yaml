server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # System logs (main system.log)
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system_logs
          __path__: /private/var/log/system.log

  # DHCP logs (macOS unified logging, tailed to file by log_capture.sh - see
  # com.stapler.vaping-log-dhcp launchd agent. /var/log/system.log stopped
  # receiving DHCP output after macOS moved this to unified logging.)
  - job_name: dhcp
    static_configs:
      - targets:
          - localhost
        labels:
          job: dhcp_logs
          __path__: /Users/tstapler/Library/Logs/vaping-unified-logs/dhcp.log
    pipeline_stages:
      - match:
          selector: '{job="dhcp_logs"} |= "Filtering the log data using"'
          action: drop

  # Network configuration logs (same unified-logging situation as DHCP above;
  # see com.stapler.vaping-log-network-config launchd agent)
  - job_name: network_config
    static_configs:
      - targets:
          - localhost
        labels:
          job: network_config
          __path__: /Users/tstapler/Library/Logs/vaping-unified-logs/network_config.log
    pipeline_stages:
      - match:
          selector: '{job="network_config"} |= "Filtering the log data using"'
          action: drop

  # WiFi logs
  - job_name: wifi
    static_configs:
      - targets:
          - localhost
        labels:
          job: wifi_logs
          __path__: /private/var/log/wifi.log

  # Power Management logs (for sleep/wake events; same unified-logging
  # situation as DHCP above - see com.stapler.vaping-log-power launchd agent)
  - job_name: power_management
    static_configs:
      - targets:
          - localhost
        labels:
          job: power_logs
          __path__: /Users/tstapler/Library/Logs/vaping-unified-logs/power.log
    pipeline_stages:
      - match:
          selector: '{job="power_logs"} |= "Filtering the log data using"'
          action: drop

  # USB/Thunderbolt kernel logs (same unified-logging situation as DHCP above;
  # see com.stapler.vaping-log-usb-thunderbolt launchd agent). The Mac is
  # wired via en7, a Thunderbolt Ethernet port on a dock, not built-in
  # Ethernet - dock disconnects/re-enumerations show up here.
  - job_name: usb_thunderbolt
    static_configs:
      - targets:
          - localhost
        labels:
          job: usb_thunderbolt_logs
          __path__: /Users/tstapler/Library/Logs/vaping-unified-logs/usb_thunderbolt.log
    pipeline_stages:
      - match:
          selector: '{job="usb_thunderbolt_logs"} |= "Filtering the log data using"'
          action: drop

  # Install logs (may contain network/system configuration changes)
  - job_name: install
    static_configs:
      - targets:
          - localhost
        labels:
          job: install_logs
          __path__: /private/var/log/install.log
