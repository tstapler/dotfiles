apiVersion: 1

groups:
  - orgId: 1
    name: network-alerts
    folder: Network Monitoring
    interval: 1m
    rules:
      - uid: sustained-packet-loss
        title: Sustained Packet Loss
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Packet loss to {{ $labels.host }} has exceeded 5% for 5+ minutes"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: packet_loss
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [5]

      - uid: sustained-high-latency
        title: Sustained High Latency
        condition: C
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Average latency to {{ $labels.host }} has exceeded 150ms for 5+ minutes"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: rate(average_latency_milliseconds_sum[5m]) / rate(average_latency_milliseconds_count[5m])
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [150]

  # Filesystem health (btrfs_health.py). Receivers: contactpoints.yml / policies.yml.
  - orgId: 1
    name: filesystem-alerts
    folder: Filesystem Health
    interval: 1m
    rules:
      - uid: btrfs-unallocated-warn
        title: btrfs unallocated space low
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Unallocated space on btrfs {{ $labels.uuid }} is below 10 GiB"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'btrfs_unallocated_bytes'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params: [10737418240]

      - uid: btrfs-unallocated-crit
        title: btrfs unallocated space critical
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Unallocated space on btrfs {{ $labels.uuid }} is below 3 GiB: metadata exhaustion is imminent, run a balance"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'btrfs_unallocated_bytes'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params: [3221225472]

      - uid: btrfs-metadata-headroom-warn
        title: btrfs usable metadata headroom low
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Usable metadata headroom on btrfs {{ $labels.uuid }} is below 2 GiB"
          description: "Usable metadata headroom (total - used - reserved - pinned - readonly - may_use - global reserve) only binds when no spare chunk can be allocated, so it is gated on unallocated < 20 GiB; a balance swings may_use by several GiB while the filesystem is healthy."
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'btrfs_metadata_usable_headroom_bytes and on(uuid) (btrfs_unallocated_bytes < 21474836480)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params: [2147483648]

      - uid: btrfs-metadata-headroom-crit
        title: btrfs usable metadata headroom critical
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Usable metadata headroom on btrfs {{ $labels.uuid }} is below 256 MiB: reads and unlinks may block in reserve_bytes"
          description: "Usable metadata headroom (total - used - reserved - pinned - readonly - may_use - global reserve) only binds when no spare chunk can be allocated, so it is gated on unallocated < 20 GiB; a balance swings may_use by several GiB while the filesystem is healthy."
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'btrfs_metadata_usable_headroom_bytes and on(uuid) (btrfs_unallocated_bytes < 21474836480)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params: [268435456]

      - uid: btrfs-device-errors-increasing
        title: btrfs device error counters increasing
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "btrfs {{ $labels.type }} errors increased on device {{ $labels.devid }} of {{ $labels.uuid }}"
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'increase(btrfs_device_errors_total[15m])'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]

      - uid: btrfs-exporter-stale
        title: btrfs exporter stale or missing
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "btrfs_health.py has not written metrics for 5+ minutes, or the series is gone"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'time() - btrfs_exporter_last_success_timestamp_seconds'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [300]

      - uid: node-exporter-down
        title: node_exporter target down
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "Prometheus cannot scrape node_exporter on {{ $labels.instance }}"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'up{job="node-exporter"}'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: lt
                    params: [1]

      - uid: deadmans-switch-heartbeat
        title: Dead mans switch heartbeat
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        labels:
          severity: heartbeat
        annotations:
          summary: "Always firing by design: route to an external receiver that alerts when it stops arriving"
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'vector(1)'
              instant: true
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              refId: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
