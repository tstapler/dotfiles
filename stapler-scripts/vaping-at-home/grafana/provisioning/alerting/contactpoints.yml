apiVersion: 1

# PLACEHOLDERS, not working endpoints. Grafana has no native ntfy contact point, so
# ntfy is reached as a webhook. Nothing is chosen yet: ntfy server, topic and auth
# are open decisions. Set NTFY_WEBHOOK_URL / HEARTBEAT_URL in the environment that runs
# `docker compose` (default: unresolvable *.invalid, so delivery fails loudly in the
# Grafana log instead of silently going nowhere). For auth, add under `settings`:
#   authorization_scheme: Bearer
#   authorization_credentials: $__env{NTFY_TOKEN}
contactPoints:
  - orgId: 1
    name: ntfy-placeholder
    receivers:
      - uid: ntfy-placeholder
        type: webhook
        settings:
          url: $__env{NTFY_WEBHOOK_URL}
          httpMethod: POST

  # Must point OUTSIDE this machine (see README "Dead man's switch").
  - orgId: 1
    name: heartbeat-placeholder
    receivers:
      - uid: heartbeat-placeholder
        type: webhook
        settings:
          url: $__env{HEARTBEAT_URL}
          httpMethod: POST
